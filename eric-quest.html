<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#1b0a33">
<title>Happy Birthday Eric! - Quest for the Cake</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;touch-action:none;font-family:"Courier New",monospace;
  background:linear-gradient(135deg,#2a0a4a,#12061f 45%,#3a0a2a)}
#app{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:14px}
#frame{line-height:0;border:4px solid #fcd838;
  box-shadow:0 0 0 4px #e8403c,0 0 0 8px #a050d8,0 0 0 12px #3c78f0,0 0 40px 10px rgba(168,80,216,.55)}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;touch-action:none}
#pad{display:none;flex:0 0 auto;align-items:center;justify-content:space-between;padding:4px 18px 14px;gap:12px}
@media (pointer:coarse),(max-width:760px){#pad{display:flex}}
#dpad{display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:4px;width:min(30vh,156px);height:min(30vh,156px)}
#abs{display:flex;align-items:center;gap:16px}
.b{border:3px solid #fcd838;background:#5a2a8a;color:#fff;border-radius:10px;font:bold 22px "Courier New",monospace;
  padding:0;touch-action:none;box-shadow:0 4px 0 #2a1048}
.b.on{background:#a050d8;transform:translateY(3px);box-shadow:0 1px 0 #2a1048}
.round{width:min(17vh,78px);height:min(17vh,78px);border-radius:50%}
#bA{background:#e8403c;margin-top:-34px}#bA.on{background:#ff7a70}
#bB{background:#3c78f0}#bB.on{background:#7aa4ff}
@media (orientation:landscape) and (pointer:coarse){
  #app{flex-direction:row}#pad{display:contents}
  #dpad{order:0;align-self:center;margin:0 6px 0 14px;width:min(40vh,150px);height:min(40vh,150px)}
  #stage{order:1;padding:8px}#abs{order:2;align-self:center;margin:0 14px 0 6px}
  .round{width:min(22vh,76px);height:min(22vh,76px)}#bA{margin-top:-40px}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage"><div id="frame"><canvas id="c"></canvas></div></div>
  <div id="pad">
    <div id="dpad">
      <button class="b" data-k="u" style="grid-area:1/2">&#9650;</button>
      <button class="b" data-k="l" style="grid-area:2/1">&#9664;</button>
      <button class="b" data-k="r" style="grid-area:2/3">&#9654;</button>
      <button class="b" data-k="d" style="grid-area:3/2">&#9660;</button>
    </div>
    <div id="abs">
      <button class="b round" id="bB" data-k="b">B</button>
      <button class="b round" id="bA" data-k="a">A</button>
    </div>
  </div>
</div>

  for(var r=0;r<5;r++){var row=g[r];for(var q=0;q<5;q++)if(row.charAt(q)==='#')ctx.fillRect(x+q*s,y+r*s,s,s);}}

};
function flipH(c){var o=mk(16,16),x=o.getContext('2d');x.translate(16,0);x.scale(-1,1);x.drawImage(c,0,0);return o;}
/* side-facing hero variants: move the eyes toward the facing direction */
function heroSide(dir){var c=mk(16,16),x=c.getContext('2d');x.drawImage(SP.hero,0,0);
  x.fillStyle=PAL.s;x.fillRect(4,7,1,1);x.fillRect(11,7,1,1);x.fillStyle=PAL.k;
  if(dir==='l'){x.fillRect(3,7,1,1);x.fillRect(10,7,1,1);}else{x.fillRect(5,7,1,1);x.fillRect(12,7,1,1);}return c;}
SP.heroL=heroSide('l');SP.heroR=heroSide('r');

/* ===== tiles ===== */
function mkT(fn){var c=mk(16,16);fn(c.getContext('2d'));return c;}
function R(x,col,a,b,w,h){x.fillStyle=col;x.fillRect(a,b,w,h);}
function rn(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function noisy(base,a,b,seed,fl){return mkT(function(x){var r=rn(seed);R(x,base,0,0,16,16);
  for(var i=0;i<10;i++)R(x,r()<.5?a:b,(r()*15)|0,(r()*15)|0,r()<.5?1:2,1);
  if(fl){var fx=2+((r()*11)|0),fy=2+((r()*11)|0);R(x,fl,fx,fy,2,2);R(x,'#fcd838',fx,fy,1,1);}});}
function set4(base,a,b,seed,fl){return [0,1,2,3].map(function(i){return noisy(base,a,b,seed+i,i===3?fl:null);});}
var GROUND={
  patch:set4('#3aa24a','#2d8a3c','#6fd05a',1,'#f868b8'),
  forest:set4('#2b6b55','#1f5242','#418a6a',11,'#58d8f8'),
  grave:set4('#4c3b73','#3a2c5a','#6e5b9a',21,'#f0ecd0'),
  gate:set4('#34607e','#264a63','#4f86a8',31,'#fcd838')
};
var T_PATH=set4('#c28b52','#a8733c','#dca86a',41,null);
var T_WALL=mkT(function(x){R(x,'#7a6aa0',0,0,16,16);x.fillStyle='#4a3a6a';
  for(var y=0;y<16;y+=4){x.fillRect(0,y+3,16,1);var o=((y/4)%2)*4;for(var xx=o;xx<16;xx+=8)x.fillRect(xx,y,1,3);}
  R(x,'#9a8ac0',0,0,16,1);});
var T_FLOOR=mkT(function(x){R(x,'#b05ad8',0,0,16,16);R(x,'#8a3ab8',0,0,8,8);R(x,'#8a3ab8',8,8,8,8);});
var T_CARPET=mkT(function(x){R(x,'#d8283c',0,0,16,16);R(x,'#fcd838',0,0,16,1);R(x,'#fcd838',0,15,16,1);R(x,'#a01828',0,2,16,1);R(x,'#a01828',0,13,16,1);});
var T_WATER=mkT(function(x){R(x,'#3c78f0',0,0,16,16);R(x,'#2c5cc8',0,8,16,1);});
var T_WAVE=[0,1].map(function(f){return mkT(function(x){R(x,'#8ab4ff',2+f*6,3,4,1);R(x,'#8ab4ff',9-f*5,11,4,1);R(x,'#5a90f8',5+f*4,7,3,1);});});
var T_BRIDGE=mkT(function(x){R(x,'#8a5a2c',0,0,16,16);x.fillStyle='#5a381c';for(var i=3;i<16;i+=4)x.fillRect(i,0,1,16);
  R(x,'#5a381c',0,0,16,2);R(x,'#5a381c',0,14,16,2);R(x,'#c28b52',0,2,16,1);});
var T_GATE=mkT(function(x){x.drawImage(T_WALL,0,0);R(x,'#1a1024',2,0,12,16);R(x,'#2a1a3a',3,1,10,15);
  x.fillStyle='#9ca0b0';for(var i=3;i<13;i+=3)x.fillRect(i,1,1,15);R(x,'#9ca0b0',3,5,10,1);R(x,'#9ca0b0',3,11,10,1);
  R(x,'#fcd838',7,7,2,2);});

  var g=FONT[ch];x.fillStyle='#fcd838';for(var r=0;r<5;r++)for(var q=0;q<5;q++)if(g[r].charAt(q)==='#')x.fillRect(5+q,5+r,1,1);
  x.fillStyle='#8a5a2c';for(var r2=0;r2<5;r2++)for(var q2=0;q2<5;q2++)if(g[r2].charAt(q2)==='#')x.fillRect(5+q2,6+r2,1,1);
  for(var r3=0;r3<5;r3++)for(var q3=0;q3<5;q3++)if(g[r3].charAt(q3)==='#'){x.fillStyle='#fcd838';x.fillRect(5+q3,5+r3,1,1);}});};

/* ===== audio (square-wave chiptune) ===== */
var AC=null,master=null,muted=false,musicId='',mt=null,msn=0;
function aInit(){if(AC){if(AC.state==='suspended')AC.resume();return;}
  try{var C=window.AudioContext||window.webkitAudioContext;AC=new C();master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);}catch(e){AC=null;}}
function tone(f,d,type,v,t0,sl){if(!AC||muted||!f)return;var t=AC.currentTime+(t0||0),o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square';o.frequency.setValueAtTime(f,t);if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*sl),t+d);
  g.gain.setValueAtTime(v||.1,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02);}
function nf(n){return 220*Math.pow(2,n/12);}
var SFX={
  blip:function(){tone(700+Math.random()*120,.04,'square',.035);},
  sel:function(){tone(880,.05,'square',.06);},
  pick:function(){[0,4,7,12].forEach(function(n,i){tone(nf(n+12),.09,'square',.07,i*.06);});},
  horn:function(){tone(nf(0),.16,'sawtooth',.09);tone(nf(7),.24,'sawtooth',.09,.1);},
  dance:function(){[0,3,7,3,0].forEach(function(n,i){tone(nf(n+12),.07,'square',.06,i*.07);});},
  hit:function(){tone(220,.16,'sawtooth',.1,0,.4);},
  hurt:function(){tone(160,.22,'square',.1,0,.5);},
  heal:function(){[0,4,7,12,16].forEach(function(n,i){tone(nf(n+12),.1,'triangle',.1,i*.07);});},
  level:function(){[0,4,7,12,7,12,16,19].forEach(function(n,i){tone(nf(n+12),.1,'square',.07,i*.08);});},
  gate:function(){tone(110,.6,'sawtooth',.1,0,2.5);tone(nf(0),.4,'square',.05,.5);},
  boom:function(){tone(90,.5,'sawtooth',.14,0,.3);},

};

function music(id){if(musicId===id)return;musicId=id;clearInterval(mt);msn=0;if(!id)return;var t=TRK[id];

    if(l!==null)tone(nf(l),t.ms/1000*.85,'square',.03);if(b!==null)tone(nf(b-12),t.ms/1000*1.7,'triangle',.08);},t.ms);}
function bday(){var seq=[[7,.75],[7,.25],[9,1],[7,1],[12,1],[11,2],[7,.75],[7,.25],[9,1],[7,1],[14,1],[12,2],
  [7,.75],[7,.25],[19,1],[16,1],[12,1],[11,1],[9,2],[17,.75],[17,.25],[16,1],[12,1],[14,1],[12,2]];
  var t=.15,b=.3;seq.forEach(function(s){tone(nf(s[0]+12),s[1]*b*.95,'square',.08,t);tone(nf(s[0]),s[1]*b*.95,'triangle',.07,t);t+=s[1]*b;});}

/* ===== maps (generated, then checked so everything is reachable) ===== */
function passable(ch){return !(ch==='T'||ch==='P'||ch==='G'||ch==='g'||ch==='W'||ch==='#'||ch==='C');}
var D4=[[1,0],[-1,0],[0,1],[0,-1]];
function reach(g,sp){
  var seen={},q=[[sp.spawn[0],sp.spawn[1]]];seen[sp.spawn[0]+','+sp.spawn[1]]=1;
  while(q.length){var c=q.shift();D4.forEach(function(d){var x=c[0]+d[0],y=c[1]+d[1];
    if(x<0||y<0||x>=CW||y>=CH||seen[x+','+y]||!passable(g[y][x]))return;seen[x+','+y]=1;q.push([x,y]);});}
  var ok=true;
  sp.items.concat(sp.exits).forEach(function(p){if(!seen[p[0]+','+p[1]])ok=false;});
  sp.npcs.forEach(function(p){var any=false;D4.forEach(function(d){if(seen[(p[0]+d[0])+','+(p[1]+d[1])])any=true;});if(!any)ok=false;});
  return ok;
}
function build(sp){
  var g=null,tries;
  for(tries=0;tries<80;tries++){
    var rnd=rn(sp.seed+tries*977);g=[];
    for(var y=0;y<CH;y++){var row=[];for(var x=0;x<CW;x++)row.push((x===0||y===0||x===CW-1||y===CH-1)?sp.edge:sp.base);g.push(row);}
    sp.ops.forEach(function(o){if(o[0]==='f'){for(var yy=o[2];yy<o[2]+o[4];yy++)for(var xx=o[1];xx<o[1]+o[3];xx++)g[yy][xx]=o[5];}else g[o[2]][o[1]]=o[3];});
    var res={};
    sp.items.concat(sp.npcs,sp.exits,sp.foes,[sp.spawn]).forEach(function(k){
      for(var dx=-1;dx<=1;dx++)for(var dy=-1;dy<=1;dy++)res[(k[0]+dx)+','+(k[1]+dy)]=1;});
    sp.scatter.forEach(function(s){var n=0,guard=0;
      while(n<s[1]&&guard++<900){var x=1+((rnd()*(CW-2))|0),y=1+((rnd()*(CH-2))|0);
        if(s[2]&&(x<s[2][0]||x>s[2][1]))continue;if(g[y][x]!==sp.base||res[x+','+y])continue;g[y][x]=s[0];n++;}});
    if(reach(g,sp))break;
  }
  return g;
}

function renderStatic(){
  var x=STATIC.getContext('2d'),g=MAP.g,th=MAP.sp.theme,gr=GROUND[th]||GROUND.patch;
  var trees=[SP.treeO,SP.treeP,SP.treeG];
  for(var ty=0;ty<CH;ty++)for(var tx=0;tx<CW;tx++){
    var ch=g[ty][tx],h=((tx*7+ty*13+tx*ty)%4+4)%4,gx=tx*TS,gy=ty*TS,base=gr[h];
    if(th==='castle')base=T_FLOOR;
    switch(ch){
      case 'p':x.drawImage(T_PATH[h],gx,gy);break;
      case 'T':x.drawImage(base,gx,gy);x.drawImage(trees[(th==='forest'?1:0)+((tx*5+ty*3)%2)+(th==='patch'?0:0)],gx,gy);break;
      case 'P':x.drawImage(base,gx,gy);x.drawImage(SP.pump,gx,gy);break;
      case 'G':case 'g':x.drawImage(base,gx,gy);x.drawImage(SP.grave,gx,gy);break;
      case 'W':x.drawImage(T_WATER,gx,gy);break;
      case '=':x.drawImage(T_BRIDGE,gx,gy);break;
      case '#':x.drawImage(T_WALL,gx,gy);break;
      case 'F':x.drawImage(T_FLOOR,gx,gy);break;
      case 'R':case 'C':x.drawImage(T_CARPET,gx,gy);break;
      case 'L':x.drawImage(G.f.gate?T_OPEN:T_GATE,gx,gy);break;
      case '<':x.drawImage(th==='castle'?T_LTF:T_LT,gx,gy);break;
      case '>':x.drawImage(T_GT,gx,gy);break;
      default:x.drawImage(base,gx,gy);
    }
  }
}

    for(var i=0;i<ls.length;i+=3)pages.push({who:who,lines:ls.slice(i,i+3)});});

function updDialog(dt){
  var pg=D.pages[D.i],total=pg.lines.join('').length,last=D.i===D.pages.length-1;
  var before=Math.floor(D.ch);D.ch=Math.min(total,D.ch+dt*48);
  if(Math.floor(D.ch)>before&&Math.floor(D.ch)%3===0)SFX.blip();
  D.ready=D.ch>=total&&last;
  if(D.ready&&D.ask){
    if(P.u||P.l){D.ask.sel=(D.ask.sel+D.ask.opts.length-1)%D.ask.opts.length;SFX.sel();}
    if(P.d||P.r){D.ask.sel=(D.ask.sel+1)%D.ask.opts.length;SFX.sel();}}
  if(P.a){
    if(D.ch<total){D.ch=total;}
    else if(!last){D.i++;D.ch=0;SFX.sel();}
    else{SFX.sel();var cb=D.cb,as=D.ask;D=null;G.mode='play';
      if(as)as.cb(as.sel);else if(cb)cb();}}
}

  disc(40,104,13,'#fcf4c8');disc(35,100,3,'#e8dca0');disc(46,109,2,'#e8dca0');
  rect('#2a1250',226,126,84,50);rect('#2a1250',220,104,20,72);rect('#2a1250',296,100,20,76);rect('#2a1250',252,92,20,40);
  for(i=0;i<4;i++){rect('#2a1250',220+i*6,98,3,6);rect('#2a1250',296+i*6,94,3,6);}
  rect('#2a1250',252,86,4,6);rect('#2a1250',260,86,4,6);rect('#2a1250',268,86,4,6);
  var lit=Math.floor(T*2)%2;
  rect(lit?'#fcd838':'#f89830',227,112,6,8);rect('#fcd838',303,110,6,8);rect(lit?'#f89830':'#fcd838',259,100,6,8);
  rect('#fcd838',268,146,10,16);rect('#14062e',270,150,6,12);
  rect('#1f5242',0,172,W,70);rect('#2b6b55',0,172,W,3);
  for(i=0;i<7;i++){ctx.drawImage(SP.pump,0,0,16,16,8+i*46,166+(i%2)*10,32,32);}
  for(i=0;i<3;i++){var bx=((T*34+i*120)%380)-30;bigSprite(SP.bat,bx,92+Math.sin(T*2+i*2)*10+i*10,2);}
  bigSprite(SP.hero,52,124+Math.round(Math.sin(T*5)),3);
  bigSprite(SP.cake,150,124+Math.round(Math.sin(T*3)),3);
  rainText('HAPPY BIRTHDAY',10,3,true);
  rainText('ERIC!',30,6,true);
  ctxt('A QUEST FOR THE CAKE',72,'#fcd838',2,'#1a0b33');
  rect('rgba(20,6,40,.75)',0,190,W,22);
  if(Math.floor(T*2.2)%2)ctxt('PRESS A OR TAP TO START',194,'#fff',2,'#1a0b33');
  ctxt('ARROWS OR WASD MOVE  SPACE TALK  M SOUND',224,'#c8a8f0',1);
  speaker();
}
function drawEnding(){
  var e=G.end,bands=['#12062a','#1b0a33','#2a0f4a','#3d1466','#561a80','#7a2494'],i;
  for(i=0;i<6;i++)rect(bands[i],0,i*34,W,34);
  STARS.forEach(function(s){if(Math.floor(T*3+s[2])%3)rect('#fff',s[0],s[1],1,1);});
  for(var k=0;k<6;k++){var ph=((T+k*.9)%3.4);
    if(ph<1.8){var cx=40+((k*97)%240),cy=60+((k*53)%70),r=ph*34,a=1-ph/1.8;ctx.globalAlpha=a;
      for(var d=0;d<14;d++){var an=d/14*6.283;rect(RAIN[(k+d)%8],Math.round(cx+Math.cos(an)*r),Math.round(cy+Math.sin(an)*r+ph*ph*6),3,3);}ctx.globalAlpha=1;}}
  rect('#1f5242',0,196-14,W,60);rect('#2b6b55',0,182,W,3);
  rainText('HAPPY BIRTHDAY',8,3,true);rainText('ERIC!',28,6,true);
  bigSprite(SP.cake,128,86+Math.round(Math.sin(T*3)*2),4);
  var cast=[SP.hero,SP.pete,SP.witch,SP.ghost,SP.skel,SP.knight,SP.marge,SP.count];
  cast.forEach(function(c,j){ctx.drawImage(c,0,0,16,16,14+j*37,150+Math.round(Math.abs(Math.sin(T*6+j))*-5)+14,32,32);});
  if(e.t<9){var lines=wrap('EVERYONE SINGS! EVEN THE COUNT!',24);
    for(i=0;i<lines.length;i++)ctxt(lines[i],200+i*14,'#fff',2,'#1a0b33');}
  else{ctxt('THE END!',200,'#fcd838',2,'#1a0b33');if(Math.floor(T*2)%2)ctxt('PRESS A TO PLAY AGAIN',216,'#fff',2,'#1a0b33');}
  CONF.forEach(function(c){rect(c.c,Math.round(c.x),Math.round(c.y),c.s,c.s);});
  speaker();
}
function draw(){
  rect('#000',0,0,W,H);
  if(G.mode==='title')drawTitle();
  else if(G.mode==='battle'&&B)drawBattle();
  else if(G.mode==='ending')drawEnding();
  else{drawWorld();drawHud();if(G.mode==='dialog'&&D)drawDialog();}
  if(G.trans)rect('rgba(0,0,0,'+Math.min(1,G.trans.t)+')',0,0,W,H);
}

/* ===== boot ===== */
newGame();music('title');resize();
var last=performance.now();
function loop(now){var dt=Math.min(.05,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop);}
requestAnimationFrame(loop);
})();
</script>
